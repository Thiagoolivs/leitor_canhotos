# nginx.conf for leitor_canhotos
#
# Architecture:
# - Proxies all dynamic requests to the gunicorn web server (web:8000).
# - Serves /static/ directly from /app/staticfiles/ (no Django overhead).
# - Serves /media/ directly from /app/media/ (PDF/image files).
# - Allows up to 50MB uploads (for large PDF canhotos).
# - Enables gzip compression for text responses.
#
# Usage: add an 'nginx' service to docker-compose.yml for production.

upstream django {
    server web:8000;
    keepalive 32;
}

# Gzip configuration
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Maximum upload size (for PDF canhotos)
    client_max_body_size 50M;

    # Serve static files directly (CSS, JS, images collected by collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Serve media files directly (uploaded canhoto PDFs and images)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # Security: prevent execution of files in media directory
        add_header X-Content-Type-Options nosniff;
    }

    # Proxy all other requests to Django/gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (generous for OCR-related requests)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (returns 200 without hitting Django)
    location = /health/ {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
